name: validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 既定の広い権限に依存せず、必要な分だけを宣言する。
permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      # サードパーティのアクションはコミット SHA でピン留めする（タグは付け替え可能なため）。
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          # checkout が .git/config に残す認証情報を後続ステップから使えないようにする。
          persist-credentials: false

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      # 検証に使う CLI はバージョンを固定する（更新は Dependabot ではなく手動で行う）。
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code@2.1.251

      - name: Validate skills and plugin definitions
        run: bash scripts/validate.sh
